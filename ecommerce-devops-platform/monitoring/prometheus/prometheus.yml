# Prometheus scrapes the API directly on the internal "monitoring" network
# (Nginx blocks /metrics from the outside).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ecommerce-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]
        labels: { service: ecommerce-api }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
