# Reverse proxy + TLS termination. Runs unprivileged (nginx-unprivileged image).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  # Writable temp paths for a non-root nginx.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;   # do not advertise the nginx version
  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 100k;

  # Structured JSON access log, correlated with app logs through request_id.
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
                              '"method":"$request_method","uri":"$request_uri","status":$status,'
                              '"bytes":$body_bytes_sent,"duration":$request_time,'
                              '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';
  access_log /dev/stdout json;

  # Docker's internal DNS. Resolving at request time means nginx still starts
  # (and returns 502) if the app is down, instead of crashing.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Brute-force protection for the login endpoint (in addition to the app's own limiter).
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

  server {
    listen 8080;
    server_name _;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # Everything else is redirected to HTTPS.
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Nginx owns TLS policy: hide the app's HSTS header so clients get exactly one.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    set $upstream http://app:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id      $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout    15s;

    # Metrics are internal only (Prometheus scrapes the app directly).
    location = /metrics { return 404; }

    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass $upstream;
    }

    location / { proxy_pass $upstream; }

    # Proxy errors as JSON, like the API's own errors.
    error_page 502 503 504 = @upstream_down;
    location @upstream_down {
      default_type application/json;
      return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"API is temporarily unavailable","requestId":"$request_id"}}';
    }
  }
}
